# Certificate for the odh-model-controller webhook server.
# Issued by an external CA ClusterIssuer (configured via params.env).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/name: certificate
    app.kubernetes.io/instance: serving-cert
    app.kubernetes.io/component: certificate
    app.kubernetes.io/created-by: odh-model-controller
    app.kubernetes.io/part-of: odh-model-controller
    app.kubernetes.io/managed-by: kustomize
  name: odh-model-controller-webhook-server
  namespace: system
spec:
  commonName: odh-model-controller-webhook-service.$(NAMESPACE).svc
  dnsNames:
    - odh-model-controller-webhook-service.$(NAMESPACE).svc
    - odh-model-controller-webhook-service.$(NAMESPACE).svc.cluster.local
  duration: 8760h  # 1 year
  renewBefore: 720h  # 30 days
  issuerRef:
    name: $(ISSUER_REF_NAME)
    kind: $(ISSUER_REF_KIND)
    group: $(ISSUER_REF_GROUP)
  secretName: odh-model-controller-webhook-cert
